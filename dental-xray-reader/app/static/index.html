<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dental X-ray Reader</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #16191d; --muted: #5b6470; --border: #d9dde3;
    --accent: #1f6feb; --accent-text: #ffffff;
    --warn-bg: #fff4e5; --warn-border: #f0a53a; --warn-text: #6b4100;
    --error-bg: #fdecec; --error-border: #e5484d; --error-text: #7a1216;
    --pathology: #e5484d; --work: #0091ff; --tooth: #9aa4b2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a20; --text: #e6e8eb; --muted: #9aa4b2; --border: #2b3038;
      --accent: #4c8dff; --accent-text: #0f1115;
      --warn-bg: #2a2010; --warn-border: #b7791f; --warn-text: #f5d9a8;
      --error-bg: #2c1416; --error-border: #e5484d; --error-text: #ffc9cb;
      --pathology: #ff6369; --work: #52a9ff; --tooth: #6b7684;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  form.card { display: grid; gap: 12px; grid-template-columns: 1fr 1fr auto; align-items: end; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: .9rem; }
  input[type=password], input[type=file] { font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; width: 100%; }
  .check { display: flex; gap: 6px; align-items: center; font-weight: 400; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text);
           border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); padding: 6px 12px; }
  .status { color: var(--muted); min-height: 1.5em; margin: 12px 0; }
  .banner { border: 1px solid; border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
  .banner.error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .results { display: grid; gap: 16px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
  .viewer canvas { width: 100%; height: auto; display: block; border-radius: 6px; background: #000; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
  .legend { display: flex; gap: 12px; color: var(--muted); font-size: .85rem; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  .tag { font-size: .75rem; font-weight: 700; color: var(--warn-text); background: var(--warn-bg);
         border: 1px solid var(--warn-border); border-radius: 4px; padding: 0 5px; }
  pre.report { white-space: pre-wrap; font: inherit; margin: 0; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 10px; }
  .stack { display: grid; gap: 16px; align-content: start; }
  .hidden { display: none !important; }
  @media (max-width: 860px) {
    form.card { grid-template-columns: 1fr; }
    .results { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>Dental X-ray Reader</h1>
  <p class="sub">AI-assisted radiograph analysis for clinical decision support. All findings must be confirmed by a licensed dentist.</p>

  <form class="card" id="form">
    <label>X-ray file (DICOM, PNG, JPEG, TIFF)
      <input type="file" id="file" accept=".dcm,.dicom,image/png,image/jpeg,image/tiff" required>
    </label>
    <label id="code-label">Access code
      <input type="password" id="code" autocomplete="off" placeholder="Required to analyze">
    </label>
    <div class="stack" style="gap:8px">
      <label class="check"><input type="checkbox" id="with-report" checked> Write report</label>
      <button type="submit" id="submit">Analyze</button>
    </div>
  </form>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div id="banners"></div>

  <section class="results hidden" id="results">
    <div class="card viewer">
      <div class="toolbar">
        <label class="check"><input type="checkbox" id="show-teeth" checked> Show teeth</label>
        <span class="legend">
          <span><span class="swatch" style="background:var(--pathology)"></span>Pathology</span>
          <span><span class="swatch" style="background:var(--work)"></span>Dental work</span>
          <span><span class="swatch" style="background:var(--tooth)"></span>Tooth</span>
        </span>
      </div>
      <canvas id="canvas" role="img" aria-label="X-ray with detected findings outlined"></canvas>
    </div>
    <div class="stack">
      <div class="card">
        <h2>Findings</h2>
        <table>
          <thead><tr><th>ID</th><th>Tooth</th><th>Finding</th><th>Confidence</th></tr></thead>
          <tbody id="findings"></tbody>
        </table>
        <p class="meta" id="summary"></p>
      </div>
      <div class="card" id="report-card">
        <h2>Draft report</h2>
        <pre class="report" id="report"></pre>
        <p class="meta" id="report-meta"></p>
      </div>
      <div><button type="button" class="secondary" id="download">Download JSON</button></div>
    </div>
  </section>
</main>

<script>
(() => {
  const PATHOLOGY = new Set(["caries", "periapical_lesion", "impacted_tooth", "bone_loss", "calculus"]);
  const LABELS = {
    caries: "Caries", periapical_lesion: "Periapical radiolucency", restoration: "Restoration",
    crown: "Crown", root_canal_treatment: "Root canal treatment", implant: "Implant",
    impacted_tooth: "Impacted tooth", bone_loss: "Alveolar bone loss", calculus: "Calculus",
  };
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch { /* storage unavailable */ } },
  };
  let result = null;
  let image = null;

  $("code").value = store.get("access-code") || "";
  fetch("health").then((r) => r.json()).then((h) => {
    if (!h.access_code_required) $("code-label").classList.add("hidden");
    if (h.configuration_problem) banner("error", "Server is not configured: " + h.configuration_problem);
  }).catch(() => {});

  function banner(kind, text) {
    const div = document.createElement("div");
    div.className = "banner " + kind;
    div.textContent = text;
    $("banners").appendChild(div);
  }

  function color(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function draw() {
    if (!result || !image) return;
    const canvas = $("canvas");
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(image, 0, 0);
    const scale = image.naturalWidth / result.image.width;
    // Size strokes and labels for how large the canvas appears on screen, not its pixel size.
    const px = canvas.width / (canvas.getBoundingClientRect().width || canvas.width);
    const line = 1.5 * px;
    ctx.font = `600 ${Math.round(12 * px)}px system-ui, sans-serif`;
    ctx.textBaseline = "bottom";

    const box = (b, stroke, label, dashed) => {
      const x = b.x1 * scale, y = b.y1 * scale, w = (b.x2 - b.x1) * scale, h = (b.y2 - b.y1) * scale;
      ctx.setLineDash(dashed ? [line * 3, line * 2] : []);
      ctx.strokeStyle = stroke;
      ctx.lineWidth = line;
      ctx.strokeRect(x, y, w, h);
      if (label) {
        const pad = 3 * px, tw = ctx.measureText(label).width;
        const th = Math.round(12 * px) + pad * 2;
        const ty = y - th < 0 ? y + th : y;
        ctx.setLineDash([]);
        ctx.fillStyle = stroke;
        ctx.fillRect(x, ty - th, tw + pad * 2, th);
        ctx.fillStyle = "#000";
        ctx.fillText(label, x + pad, ty - pad);
      }
    };

    if ($("show-teeth").checked) {
      for (const t of result.teeth) box(t.box, color("--tooth"), t.fdi === "?" ? "" : t.fdi, false);
    }
    for (const f of result.findings) {
      box(f.box, PATHOLOGY.has(f.type) ? color("--pathology") : color("--work"), f.id, f.needs_review);
    }
  }

  function render(data) {
    result = data;
    $("banners").replaceChildren();
    for (const w of data.warnings) banner(w.startsWith("DEMO MODE") ? "error" : "warn", w);

    const rows = data.findings.map((f) => {
      const tr = document.createElement("tr");
      const cells = [f.id, f.tooth || "—", LABELS[f.type] || f.type, Math.round(f.confidence * 100) + "%"];
      cells.forEach((text, i) => {
        const td = document.createElement("td");
        td.textContent = text;
        if (i === 3) td.className = "num";
        if (i === 2 && f.needs_review) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = "REVIEW";
          td.append(" ", tag);
        }
        tr.appendChild(td);
      });
      return tr;
    });
    if (!rows.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 4;
      td.textContent = "No findings detected.";
      tr.appendChild(td);
      rows.push(tr);
    }
    $("findings").replaceChildren(...rows);
    const numbered = data.teeth.filter((t) => t.fdi !== "?").length;
    $("summary").textContent =
      `${data.image.modality} · ${data.image.width}×${data.image.height} px · ` +
      `${data.teeth.length} teeth detected (${numbered} numbered) · detector: ${data.detector}`;

    $("report-card").classList.toggle("hidden", !data.report);
    if (data.report) {
      $("report").textContent = data.report.text;
      $("report-meta").textContent = `${data.report.disclaimer} Generated by ${data.report.generator}.`;
    }

    $("results").classList.remove("hidden");
    image = null;
    if (data.preview_png) {
      const img = new Image();
      img.onload = () => { image = img; draw(); };
      img.src = "data:image/png;base64," + data.preview_png;
    }
  }

  $("show-teeth").addEventListener("change", draw);
  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 150); });

  $("download").addEventListener("click", () => {
    if (!result) return;
    const { preview_png, ...rest } = result;
    const blob = new Blob([JSON.stringify(rest, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `xray-analysis-${result.study_id}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const file = $("file").files[0];
    if (!file) return;
    const code = $("code").value.trim();
    store.set("access-code", code);

    const withReport = $("with-report").checked;
    const body = new FormData();
    body.append("file", file);
    $("submit").disabled = true;
    $("banners").replaceChildren();
    $("status").textContent = withReport ? "Analyzing and writing report… this can take up to a minute." : "Analyzing…";
    try {
      const resp = await fetch(`analyze?preview=true&report=${withReport}`, {
        method: "POST", body, headers: code ? { "X-Access-Code": code } : {},
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        const detail = typeof data.detail === "string" ? data.detail : `Request failed (HTTP ${resp.status})`;
        throw new Error(resp.status === 401 ? "Access code is missing or incorrect." : detail);
      }
      render(data);
      $("status").textContent = `Done. ${data.findings.length} finding(s).`;
    } catch (err) {
      $("status").textContent = "";
      banner("error", err.message || "Could not reach the server.");
    } finally {
      $("submit").disabled = false;
    }
  });
})();
</script>
</body>
</html>
