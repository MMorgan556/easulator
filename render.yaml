# Render Blueprint for the dental X-ray reader (https://render.com/docs/blueprint-spec).
# Paths are relative to the repository root.
services:
  - type: web
    name: dental-xray-reader
    runtime: docker
    plan: free
    dockerfilePath: ./dental-xray-reader/Dockerfile
    dockerContext: ./dental-xray-reader
    healthCheckPath: /health
    # Only changes to the reader redeploy it (not the calculator).
    buildFilter:
      paths:
        - dental-xray-reader/**
    envVars:
      # Uploads are refused until ACCESS_CODE is set to 12+ characters.
      - key: REQUIRE_ACCESS_CODE
        value: "true"
      - key: ACCESS_CODE
        sync: false
      - key: DETECTOR_BACKEND
        value: demo
      - key: REPORT_BACKEND
        value: auto
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      # One image decode at a time keeps 20 MP images within the free plan's 512 MB
      # (measured peak ~280 MB). Raise only on a plan with more memory.
      - key: MAX_CONCURRENT_IMAGES
        value: "1"
