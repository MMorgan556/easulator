name: Deploy site to GitHub Pages

# One Pages site: the calculator at the root, the dental X-ray reader at /xray/.
on:
  push:
    branches: [main]
    paths:
      - 'calculator/**'
      - 'dental-xray-reader/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dental-xray-reader/web/package-lock.json
      - run: node --test calculator/calculator.test.js
      - run: npm ci
        working-directory: dental-xray-reader/web
      - run: npm test
        working-directory: dental-xray-reader/web

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dental-xray-reader/web/package-lock.json
      - name: Build X-ray reader
        working-directory: dental-xray-reader/web
        run: |
          npm ci
          npm run vendor
      - name: Assemble site
        run: |
          mkdir -p _site/xray
          cp -r calculator/. _site/
          cd dental-xray-reader/web
          cp -r index.html icon.svg css js model vendor ../../_site/xray/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
